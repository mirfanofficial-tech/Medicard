name: medicard-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medicard
      POSTGRES_PASSWORD: medicard
      POSTGRES_DB: medicard
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicard"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: medicard
      MINIO_ROOT_PASSWORD: medicard123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - ./volumes/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the bucket on first run, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 medicard medicard123 &&
      mc mb --ignore-existing local/medicard-records &&
      echo 'bucket ready'
      "
