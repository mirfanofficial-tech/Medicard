<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MediCard — your complete health history, shared only when you say so.">
  <meta name="theme-color" content="#0E7A73">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MediCard">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MediCard — your health, your control</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;background:#0A5D57">
  <!-- Branded loading screen; removed on the first Flutter frame. -->
  <div id="splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(150deg,#063F3B,#0A5D57 45%,#0E7A73);color:#fff;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;z-index:9999">
    <div style="width:68px;height:68px;border-radius:20px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 4.5 3.2 8 8 9 4.8-1 8-4.5 8-9V6z"/><path d="M12 9v6M9 12h6"/></svg>
    </div>
    <div style="font-size:26px;font-weight:800;letter-spacing:.3px">MediCard</div>
    <div style="width:140px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden"><div style="width:40%;height:100%;background:#7CF0D6;border-radius:4px;animation:mcslide 1.1s ease-in-out infinite"></div></div>
    <style>@keyframes mcslide{0%{margin-left:-40%}100%{margin-left:100%}}</style>
  </div>
  <script>window.addEventListener('flutter-first-frame', function () { var s = document.getElementById('splash'); if (s) s.remove(); });</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
